<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Presentation Timer MASTER</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/master.css" />
</head>
<body>
  <main class="master">
    <header class="topbar">
      <div>
        <div class="eyebrow">PRESENTATION TIMER</div>
        <h1>MASTER</h1>
      </div>
      <div id="connection" class="status-pill">CONNECTING</div>
    </header>

    <section class="current-card">
      <div class="section-label">現在の発表者</div>
      <div id="speaker" class="current-speaker">—</div>
      <div class="section-label gap">発表内容</div>
      <div id="title" class="current-title">—</div>
      <div id="time" class="master-time timer-font">00:00</div>
      <div class="timing-row">
        <span>EST <strong id="est">00:00</strong></span>
        <span>BUFFER <strong id="buffer">00:00</strong></span>
        <span id="mode" class="mode">IDLE</span>
      </div>
    </section>

    <section class="order-section">
      <div class="section-heading">
        <div>
          <div class="section-label">発表順</div>
          <div id="orderHint" class="subtext">≡ をドラッグして並べ替えできます。変更は自動保存されます。</div>
        </div>
        <div class="schedule-actions">
          <button id="addPresentation" class="small-action">＋ ADD</button>
          <button id="importCsv" class="small-action">CSV IMPORT</button>
          <button id="exportCsv" class="small-action subtle">CSV EXPORT</button>
          <input id="csvFile" type="file" accept=".csv,text/csv" hidden />
        </div>
      </div>
      <div id="order" class="order-list"></div>
      <div id="emptyState" class="empty-state" hidden>
        発表データがありません。ADDまたはCSV IMPORTから追加してください。
      </div>
    </section>
  </main>

  <div class="control-dock">
    <button id="previous" class="control secondary">← PREV</button>
    <button id="reset" class="control secondary danger-outline">RESET</button>
    <button id="mainAction" class="control primary">START</button>
    <button id="next" class="control secondary">NEXT →</button>
  </div>

  <dialog id="presentationDialog" class="presentation-dialog">
    <form id="presentationForm" method="dialog">
      <div class="dialog-head">
        <div>
          <div class="section-label" id="dialogEyebrow">PRESENTATION</div>
          <h2 id="dialogTitle">発表を追加</h2>
        </div>
        <button id="closeDialog" class="icon-button" type="button" aria-label="閉じる">×</button>
      </div>
      <input id="editingId" type="hidden" />
      <label>
        <span>発表者</span>
        <input id="formSpeaker" type="text" maxlength="120" required />
      </label>
      <label>
        <span>発表内容</span>
        <textarea id="formTitle" rows="3" maxlength="500" required></textarea>
      </label>
      <div class="time-fields">
        <label>
          <span>EST</span>
          <input id="formEst" class="timer-font" type="text" inputmode="numeric" placeholder="15:00" required />
        </label>
        <label>
          <span>BUFFER</span>
          <input id="formBuffer" class="timer-font" type="text" inputmode="numeric" placeholder="03:00" required />
        </label>
      </div>
      <div id="formError" class="form-error" hidden></div>
      <div class="dialog-actions">
        <button id="deletePresentation" class="dialog-button delete" type="button" hidden>DELETE</button>
        <div class="dialog-spacer"></div>
        <button class="dialog-button" type="button" id="cancelDialog">CANCEL</button>
        <button class="dialog-button save" type="submit">SAVE</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/sortable.min.js"></script>
  <script src="/js/master.js"></script>
</body>
</html>
